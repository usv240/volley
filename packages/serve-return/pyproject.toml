[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "serve-return"
version = "0.1.1"
description = "Count adult-child conversational turns by the published five-second rule, from labelled transcripts or, with a bundled role model, unlabelled ones; keeps no words."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT; models/childes_roles.json is CC BY-NC-SA 3.0, see models/NOTICE.md" }
authors = [{ name = "Ujwal Vanjare" }]
keywords = ["conversational turns", "serve and return", "child language", "LENA", "Bee"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "pylangacq>=0.20"]

[project.urls]
Homepage = "https://github.com/usv240/volley"
Source = "https://github.com/usv240/volley/tree/main/packages/serve-return"
Evidence = "https://github.com/usv240/volley/blob/main/docs/EVIDENCE.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["serve_return*"]

[tool.setuptools.package-data]
serve_return = ["models/*.json", "models/NOTICE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
